name: Core workflow for deployment to environments

on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment to deploy to'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Set up Terraform on the runner
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6

      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Connect to Azure deployment credentials
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
          enable-AzPSSession: true
          
      - name: Initialize Terraform for deployment
        run: |
          terraform init -input=false \
          -backend-config="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
          -backend-config="key=${{ github.event.repository.name }}-${{ inputs.environment }}.tfstate"

      - name: Plan Terraform deployment
        run: |
          terraform fmt -check
          terraform validate -input=false
          terraform plan -input=false -out=tfplan

      - name: Apply Terraform deployment
        run: |
          terraform apply -input=false -auto-approve tfplan