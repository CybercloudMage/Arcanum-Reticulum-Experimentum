name: Core workflow for deployment to environments

on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment to deploy to'
        required: true
        type: string
      region:
        description: 'The region to deploy to'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_VAR_ENVIRONMENT: ${{ inputs.environment }}
      TF_VAR_RESOURCE_GROUP_NAME: "rg-cybercloudmage-infra-${{ inputs.environment }}"
      TF_VAR_RESOURCE_GROUP_LOCATION: ${{ inputs.region }}
    steps:
      - name: Set up Terraform on the runner
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Connect to Azure deployment credentials
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
          enable-AzPSSession: true

      - name: Purge matching soft-deleted Key Vault
        shell: bash
        run: |
          set -euo pipefail

          VAULT_ENV="$(echo "${TF_VAR_ENVIRONMENT}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          RESOURCE_GROUP_ID="/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/${TF_VAR_RESOURCE_GROUP_NAME}"
          VAULT_SUFFIX="$(printf '%s' "${RESOURCE_GROUP_ID}" | md5sum | cut -c1-6)"
          VAULT_NAME="kvarcanum${VAULT_ENV}${VAULT_SUFFIX}"

          DELETED_VAULT_LOCATION="$(az keyvault list-deleted --query "[?name=='${VAULT_NAME}'] | [0].properties.location" -o tsv)"
          if [[ -z "${DELETED_VAULT_LOCATION}" || "${DELETED_VAULT_LOCATION}" == "null" ]]; then
            echo "No soft-deleted Key Vault found for ${VAULT_NAME}"
            exit 0
          fi

          echo "Purging soft-deleted Key Vault ${VAULT_NAME} in ${DELETED_VAULT_LOCATION}"
          az keyvault purge --name "${VAULT_NAME}" --location "${DELETED_VAULT_LOCATION}"

          for _ in {1..30}; do
            if [[ -z "$(az keyvault list-deleted --query "[?name=='${VAULT_NAME}'] | [0].name" -o tsv)" ]]; then
              echo "Key Vault ${VAULT_NAME} is fully purged"
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for Key Vault ${VAULT_NAME} purge to complete" >&2
          exit 1
          
      - name: Initialize Terraform for deployment
        run: |
          terraform init -input=false \
          -backend-config="resource_group_name=${{ secrets.AZURE_RESOURCE_GROUP_NAME }}" \
          -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
          -backend-config="container_name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
          -backend-config="key=${{ github.event.repository.name }}-${{ inputs.environment }}.tfstate"

      - name: Plan Terraform deployment
        run: |
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out=tfplan

      - name: Apply Terraform deployment
        run: |
          terraform apply -input=false -auto-approve tfplan